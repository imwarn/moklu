<!-- @dsCard group="Surfaces" viewport="700x360" name="Light Workspace & Dark Studio" subtitle="Side-by-side daylight Quick Workspace and fixed-dark Studio inspector with zero purple glow" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: var(--font-sans);
        background: #ffffff;
        color: #18181b;
        padding: 16px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .app-frame {
        border-radius: 14px;
        border: 1px solid var(--color-border);
        background: var(--color-surface);
        color: var(--color-ink);
        box-shadow: var(--shadow-card);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        background: var(--color-panel);
        border-bottom: 1px solid var(--color-border);
      }
      .brand-lockup {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .mark {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        background: var(--color-accent);
      }
      .mode-tag {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--color-muted);
      }
      .content {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .tabs {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 4px;
        padding: 3px;
        border-radius: 9px;
        background: var(--color-panel);
        border: 1px solid var(--color-border);
      }
      .tab {
        text-align: center;
        font-size: 11px;
        font-weight: 500;
        padding: 6px 8px;
        border-radius: 6px;
        color: var(--color-muted);
      }
      .tab.active {
        background: var(--color-accent-soft);
        color: var(--color-accent-text);
        font-weight: 600;
      }
      .dropzone {
        border: 1.5px dashed var(--color-accent);
        background: var(--color-accent-soft);
        border-radius: 10px;
        padding: 18px 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        text-align: center;
      }
      .dropzone-title {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--color-ink);
      }
      .dropzone-sub {
        font-size: 11px;
        color: var(--color-muted);
      }
      .prop-card {
        background: var(--color-panel);
        border: 1px solid var(--color-border);
        border-radius: 10px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .prop-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        font-weight: 600;
      }
      .prop-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .field label {
        font-size: 10.5px;
        color: var(--color-muted);
      }
      .field-val {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 11.5px;
        padding: 6px 8px;
        border-radius: 6px;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        color: var(--color-ink);
      }
      .field-val.focused {
        border-color: var(--color-accent);
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--color-accent) 25%, transparent);
      }
      .slider-track {
        height: 4px;
        border-radius: 999px;
        background: var(--color-border);
        position: relative;
      }
      .slider-fill {
        width: 64%;
        height: 100%;
        border-radius: 999px;
        background: var(--color-accent);
      }
      .cta-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .cta-btn {
        flex: 1;
        text-align: center;
        font-size: 12px;
        font-weight: 500;
        padding: 8px 12px;
        border-radius: 8px;
        background: var(--color-accent-strong);
        color: var(--color-accent-fg);
      }
      .cta-sec {
        font-size: 12px;
        font-weight: 500;
        padding: 8px 12px;
        border-radius: 8px;
        background: var(--color-panel);
        border: 1px solid var(--color-border);
        color: var(--color-ink);
      }
      .status-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: var(--font-mono);
        font-size: 10.5px;
        color: var(--color-muted);
      }
      .status-ok { color: var(--color-success); }
    </style>
  </head>
  <body>
    <article class="app-frame">
      <header class="topbar">
        <div class="brand-lockup">
          <span class="mark"></span>
          <span>Moklu</span>
        </div>
        <span class="mode-tag">LIGHT WORKSPACE</span>
      </header>
      <div class="content">
        <div class="tabs">
          <span class="tab active">Mockup</span>
          <span class="tab">Merge</span>
          <span class="tab">Split</span>
        </div>
        <div class="dropzone">
          <span class="dropzone-title">Drop screenshot or paste</span>
          <span class="dropzone-sub">PNG, WebP, JPG · 100% local in browser</span>
        </div>
        <div class="cta-bar">
          <span class="cta-btn">Export WebP</span>
          <span class="cta-sec">Open Studio</span>
        </div>
        <div class="status-line">
          <span class="status-ok">● Zero upload</span>
          <span>1440 × 900 · 184 KB</span>
        </div>
      </div>
    </article>

    <article class="app-frame" data-surface="studio">
      <header class="topbar">
        <div class="brand-lockup">
          <span class="mark"></span>
          <span>Moklu Studio</span>
        </div>
        <span class="mode-tag">FIXED DARK</span>
      </header>
      <div class="content">
        <div class="prop-card">
          <div class="prop-head">
            <span>Browser Frame</span>
            <span style="color: var(--color-accent-text); font-family: var(--font-mono); font-size: 10.5px;">SELECTED</span>
          </div>
          <div class="prop-grid">
            <div class="field">
              <label>Width</label>
              <div class="field-val focused">1280 px</div>
            </div>
            <div class="field">
              <label>Radius</label>
              <div class="field-val">16 px</div>
            </div>
          </div>
          <div class="field">
            <label>Frame Shadow</label>
            <div class="slider-track"><div class="slider-fill"></div></div>
          </div>
        </div>
        <div class="cta-bar">
          <span class="cta-btn">Export 2x PNG</span>
          <span class="cta-sec">Copy</span>
        </div>
        <div class="status-line">
          <span>Zoom 100%</span>
          <span style="color: var(--color-accent-text);">Snap #E76536</span>
        </div>
      </div>
    </article>
  </body>
</html>
