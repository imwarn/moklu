<!-- @dsCard group="Components" viewport="700x360" name="Buttons & Interactive States" subtitle="Primary, secondary, ghost, danger, focus-visible ring, disabled, and chip states in Light and Dark" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: var(--font-sans);
        background: #ffffff;
        color: #18181b;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .surface {
        border-radius: 12px;
        border: 1px solid var(--color-border);
        background: var(--color-surface);
        color: var(--color-ink);
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .surface-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .surface-label {
        font-size: 11.5px;
        font-weight: 600;
      }
      .surface-sub {
        font-family: var(--font-mono);
        font-size: 10.5px;
        color: var(--color-muted);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .btn {
        appearance: none;
        font-family: var(--font-sans);
        font-size: 12.5px;
        font-weight: 500;
        line-height: 1;
        padding: 9px 14px;
        border-radius: 8px;
        border: 1px solid transparent;
        cursor: pointer;
        transition: transform 120ms ease, filter 120ms ease, background-color 120ms ease, border-color 120ms ease;
      }
      .btn:active:not(:disabled) { transform: scale(0.98); }
      .btn-primary {
        background: var(--color-accent-strong);
        color: var(--color-accent-fg);
      }
      .btn-primary:hover,
      .btn-primary.is-hover { filter: brightness(0.92); }
      .btn-primary.is-active { transform: scale(0.98); filter: brightness(0.86); }
      .btn-primary.is-focus,
      .btn:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px var(--color-surface), 0 0 0 4px var(--color-accent);
      }
      .btn-primary:disabled {
        opacity: 0.42;
        cursor: not-allowed;
      }
      .btn-secondary {
        background: var(--color-panel);
        color: var(--color-ink);
        border-color: var(--color-border);
      }
      .btn-secondary:hover { background: var(--color-surface); }
      .btn-ghost {
        background: transparent;
        color: var(--color-accent-text);
      }
      .btn-ghost:hover { background: var(--color-accent-soft); }
      .btn-danger {
        background: transparent;
        color: var(--color-danger);
        border-color: color-mix(in srgb, var(--color-danger) 40%, transparent);
      }
      .btn-danger:hover {
        background: color-mix(in srgb, var(--color-danger) 10%, transparent);
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11.5px;
        font-weight: 500;
        padding: 5px 10px;
        border-radius: 999px;
      }
      .chip-accent {
        background: var(--color-accent-soft);
        color: var(--color-accent-text);
      }
      .chip-ok {
        background: color-mix(in srgb, var(--color-success) 14%, transparent);
        color: var(--color-success);
      }
      .chip-warn {
        background: color-mix(in srgb, var(--color-warning) 14%, transparent);
        color: var(--color-warning);
      }
      .chip-err {
        background: color-mix(in srgb, var(--color-danger) 14%, transparent);
        color: var(--color-danger);
      }
    </style>
  </head>
  <body>
    <section class="surface">
      <div class="surface-head">
        <span class="surface-label">Light Surface States</span>
        <span class="surface-sub">Primary #C24217 + #FFF (5.14:1) · Focus ring #E5541F</span>
      </div>
      <div class="row">
        <button type="button" class="btn btn-primary">Export PNG</button>
        <button type="button" class="btn btn-primary is-hover">Hover</button>
        <button type="button" class="btn btn-primary is-active">Active</button>
        <button type="button" class="btn btn-primary is-focus">Focus Ring</button>
        <button type="button" class="btn btn-primary" disabled="disabled">Disabled</button>
      </div>
      <div class="row">
        <button type="button" class="btn btn-secondary">Open Studio</button>
        <button type="button" class="btn btn-ghost">Reset Layout</button>
        <button type="button" class="btn btn-danger">Delete Layer</button>
        <span class="chip chip-accent">Browser Frame</span>
        <span class="chip chip-ok">Local Only</span>
        <span class="chip chip-warn">Large 4K</span>
        <span class="chip chip-err">Invalid File</span>
      </div>
    </section>

    <section class="surface" data-theme="dark">
      <div class="surface-head">
        <span class="surface-label">Dark / Studio Surface States</span>
        <span class="surface-sub">Primary #C64519 + #FFF (4.92:1) · Focus ring #E76536</span>
      </div>
      <div class="row">
        <button type="button" class="btn btn-primary">Export PNG</button>
        <button type="button" class="btn btn-primary is-hover">Hover</button>
        <button type="button" class="btn btn-primary is-active">Active</button>
        <button type="button" class="btn btn-primary is-focus">Focus Ring</button>
        <button type="button" class="btn btn-primary" disabled="disabled">Disabled</button>
      </div>
      <div class="row">
        <button type="button" class="btn btn-secondary">Duplicate Slide</button>
        <button type="button" class="btn btn-ghost">Fit Canvas</button>
        <button type="button" class="btn btn-danger">Remove Asset</button>
        <span class="chip chip-accent">Selected Layer</span>
        <span class="chip chip-ok">Synced</span>
        <span class="chip chip-warn">Unsaved</span>
        <span class="chip chip-err">Export Failed</span>
      </div>
    </section>
  </body>
</html>
