name: Core Benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moklu-benchmarks
  cancel-in-progress: false

jobs:
  baseline:
    # Explicit manual run on the trusted default branch only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Record runtime context
        run: |
          {
            printf 'runner=github-hosted (ubuntu-latest)\n'
            printf 'os=%s\n' "${RUNNER_OS:-Linux}"
            printf 'arch=%s\n' "${RUNNER_ARCH:-X64}"
            printf 'node=%s\n' "$(node -v)"
            printf 'npm=%s\n' "$(npm -v)"
          } | tee benchmark-environment.txt
      - name: Run opt-in, non-gating core microbenchmarks
        run: |
          npm run bench:core 2>&1 | tee benchmark-results.txt
      - name: Preserve benchmark logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: moklu-core-benchmarks-${{ github.run_id }}
          path: |
            benchmark-environment.txt
            benchmark-results.txt
          retention-days: 30
