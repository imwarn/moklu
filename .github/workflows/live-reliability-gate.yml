name: Live Reliability Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/live/**'
      - 'tests/projectComparison.test.mjs'
      - '.github/workflows/live-reliability-gate.yml'

permissions:
  contents: read

concurrency:
  group: live-reliability-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reliability:
    # Restrict live-site reliability checks to same-repo PRs only.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check normalization unit regressions
        run: npx vitest run tests/projectComparison.test.mjs
      - name: Install Playwright Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify backup and pixel identity against deployed site
        env:
          MOKLU_DEPLOY_URL: https://moklu.app
        run: npx playwright test tests/live/reliability.spec.mjs --config=tests/live/playwright.config.mjs --project=chromium-desktop
      - name: Upload browser trace if failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-reliability-traces-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
