name: Deployment Smoke

on:
  workflow_dispatch:
    inputs:
      include_acceptance:
        description: 'Run UI acceptance against the NEWLY DEPLOYED candidate (fails on old UI)'
        type: boolean
        required: false
        default: false
      require_csp:
        description: 'Require live Content-Security-Policy after Coolify/Cloudflare headers are enabled'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  deployed-site:
    runs-on: [self-hosted, Linux, X64, coolify]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify public HTTPS response, assets and headers
        env:
          MOKLU_DEPLOY_URL: https://moklu.app
        run: node scripts/check-deployment.mjs
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run deployed-site browser smoke
        env:
          MOKLU_DEPLOY_URL: https://moklu.app
          MOKLU_LIVE_ACCEPTANCE: ${{ inputs.include_acceptance && '1' || '0' }}
          MOKLU_REQUIRE_CSP: ${{ inputs.require_csp && '1' || '0' }}
        run: npx playwright test --config tests/live/playwright.config.mjs
      - name: Upload deployment evidence and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployed-smoke-${{ github.run_id }}
          path: |
            release-evidence/deployment-smoke.json
            test-results/
          if-no-files-found: ignore
          retention-days: 14
