name: CI

on:
  push:
    branches: [main, "feat/**", "chore/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Never expose trusted self-hosted infrastructure to untrusted fork PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, coolify]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The CSP must stay consistent with the domains the app actually calls.
      # A policy that drifts from src/ai/providers.ts silently breaks a provider.
      - name: Verify response headers match the app
        run: node scripts/check-headers.mjs
      - run: npm test
      - run: npm run build

  browser-export:
    # Browser binaries execute only trusted first-party code on the self-hosted pool.
    # Avoid duplicate heavyweight browser suites on feature pushes + their PRs.
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: quality
    runs-on: [self-hosted, Linux, X64, coolify]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install real browser engines and OS dependencies
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser export and RGBA goldens
        run: npm run test:browser
      - name: Validate staged UI and enforced CSP on local production build
        run: |
          npm run build
          PORT=$((40000 + GITHUB_RUN_ID % 10000))
          node scripts/serve-headers.mjs dist "$PORT" > /tmp/moklu-csp-preview-"$GITHUB_RUN_ID".log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$PORT/" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsSI "http://127.0.0.1:$PORT/" | grep -i '^content-security-policy:'
          MOKLU_DEPLOY_URL="http://127.0.0.1:$PORT" MOKLU_LIVE_ACCEPTANCE=1 MOKLU_REQUIRE_CSP=1 \
            npx playwright test tests/live/acceptance.spec.mjs tests/live/csp.spec.mjs \
              --config=tests/live/playwright.config.mjs --project=chromium-desktop
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-export-traces-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
