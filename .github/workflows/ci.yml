name: CI

on:
  push:
    branches: [main, "feat/**", "chore/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Never expose trusted self-hosted infrastructure to untrusted fork PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, coolify]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser-export:
    # Browser binaries execute only trusted first-party code on the self-hosted pool.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: quality
    runs-on: [self-hosted, Linux, X64, coolify]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install real browser engines and OS dependencies
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser export and RGBA goldens
        run: npm run test:browser
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-export-traces-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
